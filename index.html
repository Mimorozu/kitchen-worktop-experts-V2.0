<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" />

  <!-- Preload LCP hero image -->
  <link rel="preload" as="image" href="/hero-img.webp" />

  <!-- No static title/description here: this is a pure CSR app (no SSR/
       prerendering), so a non-JS crawler sees an empty <div id="root">
       regardless of what's in <head> — a static fallback would only add a
       duplicate <title>/<meta> once React mounts, since React 19 hoists
       tags into <head> without removing ones already there. Every route
       supplies its own via <Seo> (src/components/Seo.jsx). -->
  <meta name="keywords" content="quartz worktops Birmingham, granite worktops Birmingham, kitchen worktops Birmingham, worktop fitting Birmingham, kitchen worktop installers West Midlands" />

  <!-- LocalBusiness Structured Data (site-wide, not route-specific) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Kitchen Worktop Experts",
    "description": "Premium quartz and granite kitchen worktops supply and fit in Birmingham and the West Midlands.",
    "url": "https://www.kitchenworktopexperts.co.uk",
    "telephone": "+447389185503",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Birmingham",
      "addressRegion": "West Midlands",
      "addressCountry": "GB"
    },
    "areaServed": [
      "Birmingham",
      "West Midlands",
      "Solihull",
      "Wolverhampton",
      "Coventry"
    ],
    "serviceType": [
      "Quartz Worktop Installation",
      "Granite Worktop Installation",
      "Kitchen Worktop Supply and Fit"
    ],
    "priceRange": "££"
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Microsoft Clarity — deferred to avoid blocking render -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "wqoax0o2js");
  </script>
</body>

</html>
